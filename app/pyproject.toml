[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S311"]  # random do losowania cytatu, nie do kryptografii

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert w testach jest w porządku

[tool.pytest.ini_options]
pythonpath = ["."]
