# Docelowy pipeline aplikacji quotes-api.
# W Bloku 2 budujemy go promptem od zera; ten plik jest wzorcem do porównania.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "app/**"

# Nowy push na tę samą gałąź anuluje poprzedni przebieg — nie płacimy
# za budowanie wersji, której i tak nikt nie wdroży.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Domyślnie nic. Każdy job dostaje tylko to, czego naprawdę potrzebuje.
permissions: {}

env:
  AWS_REGION: eu-central-1
  # Własne repozytorium ECR uczestnika (quotes-api-<login>), login = K8S_NAMESPACE.
  IMAGE_NAME: quotes-api-${{ vars.K8S_NAMESPACE }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: pytest -q
        working-directory: app

  build:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # potrzebne do OIDC — bez tego nie ma tokena dla AWS
    outputs:
      image: ${{ steps.obraz.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # OIDC zamiast pary kluczy w sekretach. Token żyje kilka minut
      # i nie da się go wykraść z repozytorium, bo go tam nie ma.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build i push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:staging
          build-args: APP_VERSION=${{ github.sha }}
          # Bez cache-to cache nie powstaje — samo cache-from nic nie daje.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zapisz nazwę obrazu
        id: obraz
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # Dzień 1: zwykły Deployment i Service z app/k8s-dzien1/, bez Argo Rollouts.
  # Wdrożenie przez Rollout (canary, analiza metryk) robimy w dniu 2.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bez `environment:`. Job z environment dostaje w tokenie OIDC
    # sub = ...:environment:<nazwa> zamiast ...:ref:refs/heads/main,
    # a zaufanie roli (infra/00-bootstrap) wpuszcza tylko to drugie.
    permissions:
      contents: read # checkout manifestów
      id-token: write # OIDC do AWS, potem do EKS
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name szkolenie-ai-devops --region "$AWS_REGION"

      # Bez zmiennej kubectl po cichu użyłby namespace `default` —
      # lepiej paść od razu z czytelnym komunikatem.
      - name: Sprawdź namespace
        run: test -n "$NAMESPACE" || { echo "::error::Ustaw zmienną repozytorium K8S_NAMESPACE"; exit 1; }

      # Wdrażamy dokładnie obraz z joba build (tag = SHA), a nie `latest`.
      - name: Zastosuj manifesty
        run: |
          sed "s|PODMIEN_NA_OBRAZ|$IMAGE|" app/k8s-dzien1/deployment.yaml \
            | kubectl apply -n "$NAMESPACE" -f -
          kubectl apply -n "$NAMESPACE" -f app/k8s-dzien1/service.yaml

      - name: Poczekaj na gotowość
        run: kubectl rollout status deployment/quotes-api-d1 -n "$NAMESPACE" --timeout 3m

      - name: Podsumowanie
        run: |
          kubectl get deploy,pods,svc -n "$NAMESPACE" -l szkolenie/dzien=1
          echo "Sprawdzenie z laptopa: kubectl port-forward -n $NAMESPACE svc/quotes-api-d1 8080:80"
