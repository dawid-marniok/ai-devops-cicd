apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quotes-api
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quotes-api
                # Argo Rollouts wpisuje wagi stable/canary do adnotacji
                # `alb.ingress.kubernetes.io/actions.quotes-api`. Bez `use-annotation`
                # ALB ignoruje wagi i kieruje ruch do wszystkich podów po równo.
                port:
                  name: use-annotation
