name: deploy

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "app/**"

# Nowy push na tę samą gałąź anuluje poprzedni przebieg — nie płacimy
# za budowanie wersji, której i tak nikt nie wdroży.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Domyślnie nic. Każdy job dopisuje tylko to, czego naprawdę potrzebuje.
permissions: {}

env:
  AWS_REGION: eu-central-1
  IMAGE_NAME: quotes-api
  EKS_CLUSTER: szkolenie-ai-devops

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Tylko checkout i lint lokalnie na runnerze — brak dostępu do AWS/rejestru,
    # więc wystarczy odczyt repozytorium.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check app/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Jak wyżej: pytest działa na checkout, bez sekretów i bez AWS.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: pytest -q
        working-directory: app

  build:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write jest wymagane, żeby GitHub wystawił token OIDC, który
    # aws-actions/configure-aws-credentials wymieni na tymczasowe poświadczenia AWS
    # (bez długoterminowych kluczy w sekretach). contents: read do checkoutu.
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.obraz.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:staging
          build-args: APP_VERSION=${{ github.sha }}
          # Bez cache-to cache nie powstaje — samo cache-from nic nie daje.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Zapisz nazwę obrazu
        id: obraz
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # Dzień 1: zwykły Deployment i Service z app/k8s-dzien1/, bez Argo Rollouts.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ten sam powód co w build: OIDC do AWS, potem do EKS. Celowo bez `environment:` —
    # job z environment dostaje w tokenie OIDC sub = ...:environment:<nazwa> zamiast
    # ...:ref:refs/heads/main, a trust policy roli github-actions-deploy (zarządzana
    # poza repo) ufa tylko referencji do gałęzi main.
    permissions:
      contents: read
      id-token: write
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # Bez zmiennej kubectl po cichu użyłby namespace `default` —
      # lepiej paść od razu z czytelnym komunikatem.
      - name: Sprawdź namespace
        run: test -n "$NAMESPACE" || { echo "::error::Ustaw zmienną repozytorium K8S_NAMESPACE"; exit 1; }

      # Wdrażamy dokładnie obraz z joba build (tag = SHA), a nie `latest`.
      - name: Zastosuj manifesty
        run: |
          sed "s|PODMIEN_NA_OBRAZ|$IMAGE|" app/k8s-dzien1/deployment.yaml \
            | kubectl apply -n "$NAMESPACE" -f -
          kubectl apply -n "$NAMESPACE" -f app/k8s-dzien1/service.yaml

      - name: Poczekaj na gotowość
        run: kubectl rollout status deployment/quotes-api-d1 -n "$NAMESPACE" --timeout 3m
